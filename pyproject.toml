[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-game-for-memory"
version = "1.0.0"
description = "A dependency-free, filesystem-based layered memory framework for local / offline AI games and agents."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "kuugakw", email = "kuugakw@users.noreply.github.com" }]
keywords = [
    "agent",
    "game",
    "memory",
    "rag",
    "workflow",
    "context-management",
    "snapshot",
    "archival",
    "offline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# 全部可选：不装也能跑，只是没有性能优化和 CSV/DataFrame 导出
perf = ["numpy", "jieba", "pandas"]
dev = ["pytest>=7,<9"]

[project.urls]
Homepage = "https://github.com/kuugakw/ai-game-for-memory"
Repository = "https://github.com/kuugakw/ai-game-for-memory"
Issues = "https://github.com/kuugakw/ai-game-for-memory/issues"

[tool.setuptools]
packages = ["ai_game_for_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
